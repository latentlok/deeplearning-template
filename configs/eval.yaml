defaults:
  - _self_
  - paths: default
  - model: mlp
  - data: synthetic
  - trainer: default
  - tracking: default
  - experiment: null

exp_name: eval
seed: 42
deterministic: false
dtype: float32
amp: none

# Required. Point at a checkpoint directory, e.g.
#   ckpt=outputs/mlp/2026-08-03_14-22-05_a3f9c2/ckpt/best
ckpt: null

# validation_step (cheap, teacher-forced) or rollout_step (free-running)
step: validation_step

hydra:
  run:
    dir: ${paths.output_root}/${exp_name}/${now:%Y-%m-%d_%H-%M-%S}_${run_hash:${hydra.job.override_dirname}}
  job:
    chdir: false
  job_logging:
    handlers:
      file:
        filename: ${hydra.runtime.output_dir}/eval.log
