# The LR scheduler, built without its optimizer -- the model calls this factory with
# the optimizer it just built. Optional: the default in train.yaml is `sched: null`.
#
#   python train.py sched=cosine
#   python train.py sched=cosine sched.T_max=5000
#
# T_max is in OPTIMIZER steps, matching global_step. Set it to trainer.max_steps or
# the LR bottoms out early and the tail of the run crawls.
_target_: torch.optim.lr_scheduler.CosineAnnealingLR
_partial_: true
T_max: 1000
eta_min: 0.0
